name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package unsigned app
        run: bash Scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FileTimeEdit
          path: dist/FileTimeEdit-*.zip