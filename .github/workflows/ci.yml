name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode_paths=(/Applications/Xcode_16*.app)
          test -d "${xcode_paths[0]}"
          xcode_path="${xcode_paths[${#xcode_paths[@]}-1]}"
          sudo xcode-select -s "$xcode_path"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package unsigned app
        run: bash Scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FileTimeEdit
          path: |
            dist/FileTimeEdit-*.zip
            dist/FileTimeEdit-*.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileTimeEdit
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/FileTimeEdit-$version.dmg" \
            "dist/FileTimeEdit-$version.zip" \
            --title "File Time Edit $version" \
            --generate-notes